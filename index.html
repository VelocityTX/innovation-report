<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>San Antonio &amp; the State of Innovation</title>
  <meta name="description" content="San Antonio has never had a shared baseline for its innovation economy. On November 4, that changes.">
  <style>
    @font-face {
      font-family: "Neue Haas Grotesk Text";
      src: url("assets/NeueHaasGroteskText-65Medium-Trial.otf") format("opentype");
      font-weight: 500;
      font-display: swap;
    }
    :root { --bg: #000; --fg: #fff; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--fg); }
    body {
      font-family: "Neue Haas Grotesk Text", "Helvetica Neue", Arial, sans-serif;
      font-weight: 500;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 1. Anchored consortium logos */
    .logos {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 24px clamp(16px, 5vw, 64px);
    }
    .logos a {
      display: block;
      padding: 8px 10px;
      margin: -8px -10px;
      transition: background .15s;
    }
    .logos a img { transition: filter .15s; }
    .logos a:hover, .logos a:focus-visible { background: var(--fg); }
    .logos a:hover img, .logos a:focus-visible img { filter: invert(1); }
    .logos img { height: clamp(28px, 5vw, 56px); width: auto; display: block; }

    /* Stage: black page with the official color art anchored bottom; copy stays in the black area */
    .stage {
      flex: 1;
      display: flex;
      /* art is anchored to the bottom and may be cropped at the top (tucks under the sticky logo bar) */
      background: #000 url("assets/innovation-art.webp") center bottom / cover no-repeat;
      /* reserve room under the copy for the blue hump (~1/3 of the art's height) */
      padding-bottom: calc(max(100vw * 1009 / 1559, 100vh) * 0.33);
    }
    main {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 40px;
      padding: 6vh clamp(16px, 5vw, 64px) 0;
      width: 62%;           /* keeps copy left of the color swoosh */
      max-width: 1000px;
    }
    @media (max-width: 800px) {
      .stage { background-size: 100% auto; padding-bottom: calc(100vw * 1009 / 1559); }
      main { width: 100%; max-width: none; padding-top: 6vh; padding-bottom: 6vh; }
    }
    .typewriter {
      margin: 0;
      font-weight: 500;
      font-size: clamp(26px, 3.6vw, 56px);
      line-height: 1.15;
      letter-spacing: -0.01em;
      min-height: 4.6em; /* reserve space so the button doesn't jump while typing */
      white-space: pre-wrap;
    }
    .cursor {
      display: inline-block;
      width: 0.08em;
      height: 0.95em;
      margin-left: 0.08em;
      background: var(--fg);
      vertical-align: -0.1em;
      animation: blink 1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    .cta {
      display: inline-block;
      padding: 16px 32px;
      border: 2px solid var(--fg);
      color: var(--fg);
      background: transparent;
      font: inherit;
      font-size: 20px;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      transition: background .15s, color .15s;
    }
    .cta:hover, .cta:focus-visible { background: var(--fg); color: #000; }

  </style>
</head>
<body>
  <header class="logos" aria-label="Consortium members">
    <a href="https://www.geekdom.com" target="_blank" rel="noopener"><img src="assets/logo-geekdom.png" alt="Geekdom"></a>
    <a href="https://www.portsanantonio.us" target="_blank" rel="noopener"><img src="assets/logo-port-san-antonio.png" alt="Port San Antonio"></a>
    <a href="https://www.techbloc.org" target="_blank" rel="noopener"><img src="assets/logo-techbloc.png" alt="Tech Bloc"></a>
    <a href="https://velocitytx.org" target="_blank" rel="noopener"><img src="assets/logo-velocitytx.png" alt="VelocityTX"></a>
  </header>

  <div class="stage">
  <main>
    <h1 class="typewriter" id="headline" aria-label="San Antonio has never had a shared baseline for its innovation economy. On November 4, that changes."><span id="typed"></span><span class="cursor" aria-hidden="true"></span></h1>
    <a class="cta" href="https://loom.ly/mrnXpL4" target="_blank" rel="noopener">Register Here</a>
  </main>
  </div>

  <script>
    // Types once per page load; cursor keeps blinking afterward (CSS).
    (function () {
      var text = "San Antonio has never had a shared baseline for its innovation economy.\nOn November 4, that changes.";
      var el = document.getElementById("typed");
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) { el.textContent = text; return; }
      var PAUSE_AFTER = "economy."; // dramatic beat here
      var PAUSE_MS = 1100;
      var i = 0;
      (function tick() {
        el.textContent = text.slice(0, ++i);
        if (i >= text.length) return;
        var pause = text.slice(0, i).endsWith(PAUSE_AFTER) ? PAUSE_MS : 0;
        setTimeout(tick, pause + 45 + Math.random() * 45);
      })();
    })();
  </script>
</body>
</html>
