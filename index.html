    .space-top { flex: 156 1 0; min-height: 24px; }

    .space-end {

        // Counts down to Nov 4, 2026, 8:00 AM America/Chicago (CST, UTC−6): 2026-11-04T08:00:00-06:00.

        (function () {
          var target = Date.UTC(2026, 10, 4, 14, 0);
          var cells = document.querySelectorAll("[data-unit]");
          var spoken = document.getElementById("countdown-text");
          var lastMinute = -1;
          function pad(n) { return n < 10 ? "0" + n : String(n); }
          function tick() {
            var ms = Math.max(0, target - Date.now());
            var s = Math.floor(ms / 1000);
            var values = [Math.floor(s / 86400), Math.floor(s % 86400 / 3600), Math.floor(s % 3600 / 60), s % 60];
            for (var i = 0; i < cells.length; i++) {
              var text = pad(values[i]);
              if (cells[i].textContent !== text) cells[i].textContent = text;
            }
            // Screen readers get a per-minute summary rather than every second.
            var minute = Math.floor(s / 60);
            if (minute !== lastMinute) {
              lastMinute = minute;
              spoken.textContent = ms > 0
                ? values[0] + " days, " + values[1] + " hours and " + values[2] + " minutes until the event."

            }
            if (ms > 0) setTimeout(tick, 1000 - (Date.now() % 1000) + 5);
